name: Apply room composition pass

on:
  push:
    branches:
      - feat/vertical-slice-phaser
    paths:
      - .github/workflows/apply-room-composition-pass.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/vertical-slice-phaser
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Apply deterministic composition patch
        run: node scripts/apply-room-composition-pass.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify unit tests
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Commit verified composition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-room-composition-pass.mjs .github/workflows/apply-room-composition-pass.yml
          git add src/game/RooseveltScene.ts
          git commit -m "art: make hotel floors and portals read as game architecture"
          git push origin HEAD:feat/vertical-slice-phaser
