name: Integrate generated hotel runtime art

on:
  push:
    branches:
      - feat/vertical-slice-phaser
    paths:
      - scripts/integrate-generated-runtime-assets.ready

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/vertical-slice-phaser
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Apply generated sprite integration
        run: node scripts/integrate-generated-runtime-assets.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify wall colliders and unit contracts
        run: npm run test

      - name: Verify production build
        run: npm run build

      - name: Commit verified runtime integration and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/integrate-generated-runtime-assets.ready
          rm -f scripts/integrate-generated-runtime-assets.mjs
          rm -f .github/workflows/materialize-generated-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "art: integrate generated Roosevelt sprites and wall colliders"
          git push origin HEAD:feat/vertical-slice-phaser
