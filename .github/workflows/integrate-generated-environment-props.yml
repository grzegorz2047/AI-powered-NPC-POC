name: Integrate generated environment props

on:
  push:
    branches:
      - feat/vertical-slice-phaser
    paths:
      - scripts/integrate-generated-environment-props.ready

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/vertical-slice-phaser
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Apply generated environment props
        run: node scripts/integrate-generated-environment-props.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify unit and wall-collider contracts
        run: npm run test

      - name: Verify production build
        run: npm run build

      - name: Commit verified prop integration and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/integrate-generated-environment-props.ready
          rm -f scripts/integrate-generated-environment-props.mjs
          rm -f .github/workflows/integrate-generated-environment-props.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "art: integrate generated environment prop sprites"
          git push origin HEAD:feat/vertical-slice-phaser
